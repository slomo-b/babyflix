<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="BabyFlix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5e9ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3b0764" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app "squircle" -->
  <rect x="56" y="56" width="912" height="912" rx="232" fill="url(#bg)"/>
  <rect x="56" y="56" width="912" height="912" rx="232" fill="url(#glow)"/>

  <!-- play button -->
  <path
    d="M400 344 C382 333 360 346 360 367 L360 657 C360 678 382 691 400 680 L654 535 C672 525 672 499 654 489 Z"
    fill="url(#play)"
    filter="url(#soft)"/>
</svg>
