name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS – Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
          # macOS – Intel
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Linux
          - platform: ubuntu-22.04
            target: ""
          # Windows
          - platform: windows-latest
            target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      - name: Build app + installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # On tag pushes (v*), publish a draft GitHub Release with all installers.
          tagName: v__VERSION__
          releaseName: "BabyFlix v__VERSION__"
          releaseBody: "Download the installer for your platform below."
          releaseDraft: true
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: babyflix-${{ matrix.platform }}-${{ matrix.target || 'default' }}
          path: |
            src-tauri/target/**/release/bundle/**
          if-no-files-found: warn
